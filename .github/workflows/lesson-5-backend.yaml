name: Lesson 5 SAST + Tests + Deploy

on:
  push:
    branches:
      - lesson-5

jobs:
  security_test:
    name: Lesson 5 SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PyCharm Python Security Scanner
        uses: tonybaloney/pycharm-security@1.25.1
  build_and_test:
    name: Build and Test (backend)
    needs: [security_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest django_mock_queries six coverage

      - name: Unit tests with coverage
        run: |
          coverage run -m pytest --maxfail=1 -q
          coverage report

  deploy:
    name: Deploy (placeholder)
    needs: [build_and_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo "Placeholder for Deployment"
